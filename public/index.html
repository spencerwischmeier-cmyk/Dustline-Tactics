/* ---- polish pass: one surface language for every control ---- */
:root{--gold:#ffc247;--ink:#15110b;--line:#6b5631;--surf:linear-gradient(180deg,rgba(58,47,29,.94),rgba(27,22,14,.94))}
#panel{border-top:0;border-radius:16px 16px 0 0;background:linear-gradient(180deg,rgba(44,35,21,.96),rgba(18,15,10,.98));padding-top:10px;box-shadow:0 -1px 0 #8a6c2e,0 -12px 30px rgba(0,0,0,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#panel::before{content:'';position:absolute;left:14%;right:14%;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--gold) 25%,var(--gold) 75%,transparent);pointer-events:none}
.ph{align-items:center;margin-bottom:8px}.ph strong{border-left:3px solid var(--gold);padding-left:7px;line-height:1.1}
.qbar{height:6px;border-radius:3px;background:#1b160e;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);margin:-3px 0 8px}.qbar i{border-radius:3px;background:linear-gradient(90deg,#3f8cff,#8fd4ff);box-shadow:0 0 8px rgba(110,193,255,.7)}
#toast{border-radius:10px;border-color:#8a6c2e;border-left:3px solid var(--gold);background:linear-gradient(180deg,rgba(48,39,24,.96),rgba(20,17,12,.96));padding:8px 15px;transform:translate(-50%,8px);transition:opacity .25s,transform .25s}
#toast[style*="opacity: 1"],#toast[style*="opacity:1"]{transform:translate(-50%,0)}
#ov{background:radial-gradient(120% 70% at 50% 0%,rgba(74,56,24,.55),rgba(14,11,7,0) 60%),repeating-linear-gradient(0deg,rgba(255,194,71,.025) 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,rgba(255,194,71,.025) 0 1px,transparent 1px 28px),rgba(14,11,7,.95);scrollbar-width:none}#ov::-webkit-scrollbar{display:none}
#ov h1{background:linear-gradient(180deg,#fff6e0,#d9c69c);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:10px;margin-bottom:12px;position:relative}
#ov h1 i{background:linear-gradient(180deg,#ffe08a,#f0a020);-webkit-background-clip:text;background-clip:text;color:transparent}
#ov h1::after{content:'';position:absolute;left:0;bottom:0;width:64px;height:3px;border-radius:2px;background:var(--gold);box-shadow:0 0 10px rgba(255,194,71,.6)}
#ov p.lb{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#b3a383;margin:16px 0 7px;display:flex;align-items:center;gap:8px}
#ov p.lb::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#5b4a2c,transparent)}
#ov p.lb b{color:var(--gold);letter-spacing:.06em}#ov p.lb span,#ov p.lb small{text-transform:none;letter-spacing:0;font-weight:500}
.cmdd{border-radius:10px;background:linear-gradient(180deg,#2c2314,#1f180d);border-color:#7a6338;box-shadow:inset 0 1px 0 rgba(255,236,190,.08)}
.mapf,.mapb{border-radius:10px;box-shadow:0 8px 18px rgba(0,0,0,.45)}.mapc.on .mapf{box-shadow:0 0 0 2px var(--gold) inset,0 8px 22px rgba(255,194,71,.22)}
.sw{box-shadow:inset 0 2px 3px rgba(255,255,255,.3),0 2px 4px rgba(0,0,0,.5)}.sw.on{box-shadow:0 0 0 2px #14110c,0 0 0 4px #f3ead8,0 0 12px rgba(255,255,255,.35)}
/* volume sliders: the same thumb as the graphics slider, with the track filled up to the setting */
.vol{margin:0 0 14px}.vol .vh{display:flex;justify-content:space-between;align-items:baseline;font-size:15px;font-weight:700;color:#f3ead8}.vol output{color:#ffc247;font-variant-numeric:tabular-nums}

#gq::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3cf,#ffc247 55%,#c98512);border:2px solid #15110b;box-shadow:0 2px 6px rgba(0,0,0,.6)}

button:focus-visible,#gq:focus-visible{outline:2px solid #fff3cf;outline-offset:2px}

/* ---- title screen ---- */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:max(34px,env(safe-area-inset-top)) 22px max(30px,env(safe-area-inset-bottom));background:#14110c;overflow:hidden;transition:opacity .55s ease,transform .55s ease;touch-action:none}

@keyframes tfade{to{opacity:1}}
@keyframes tin{from{opacity:0;transform:translateY(18px) scale(.96);letter-spacing:.18em}to{opacity:1;transform:none;letter-spacing:.05em}}

 has:(t,built)=>G.blds.some(b=>b.team===0&&b.hp>0&&b.type===t&&(!built||b.built)),
 b:t=>G.blds.find(b=>b.team===0&&b.hp>0&&b.type===t),
 hub:()=>G.blds.find(b=>b.team===0&&b.type==='hq'&&b.hp>0),
 cen:()=>scr2w(VW/2,VH*.42,0),
 log:k=>!!(G.tl&&G.tl.indexOf(k)>=0),
 sel:t=>G.sel.filter(u=>u.type===t).length,
 armed:()=>G.units.filter(u=>u.team===0&&u.hp>0&&!u.rm&&!UD[u.type].civ).length,
 queued:(bt,t)=>G.blds.some(b=>b.team===0&&b.type===bt&&b.queue.indexOf(t)>=0),
 view:(M,where)=>{const q=M.at(where);centerOn(q[0],q[1]+VH*.13/cam.z);},

/* everything a lesson expects to be there already, for when the player starts part-way through */
function tutKit(M,L){
 if(!TU.hub()){M.bld(M.P,'hq','start');}
 if(TU.n('harv')<2)M.spawn(M.P,'harv',2-TU.n('harv'),'start',{spread:60});

 TU.money(M,L>=12?6500:3000);}

const TUMAN=[
 ['Game modes','<ul><li><b>Single player</b>: you against bots on any battlefield. Choose the map, your commander, the bots\' commanders and the difficulty, from Easy to <b>War is Hell</b>.</li><li><b>Campaign</b>: eight story missions with their own maps, objectives, commanders and achievements.</li><li><b>Multiplayer</b>: co-op against bots or head to head with another player.</li><li><b>Sandbox</b>: everything unlocked, ◆999,999 and 60 stars, for trying things out.</li><li><b>Directory</b>: every unit, building and super weapon, with full stats and a live demonstration.</li></ul>'],
 ['Winning and losing','<ul><li>In a battle you win when the enemy has nothing left standing, and you lose when you have nothing left. Campaign missions have their own objectives.</li><li>Your <b>Hub</b> makes Harvesters and a <b>Mobile Command</b>. Keep it safe: rebuilding without one is hard.</li><li>Save from the pause menu (<b>II</b>) and load from the mode screens. A battle is also kept when you leave it.</li></ul>'],
 ['Controls','<ul><li><b>Tap</b> a unit to select it, then tap ground to move or an enemy to attack. <b>Double-tap</b> a unit to take every unit of that type on screen.</li><li><b>Drag</b> to scroll and <b>pinch</b> to zoom. In 3D, <b>twist two fingers</b> or tap ⟲ ⟳ to turn the camera.</li><li><b>BOX</b> makes your next drag a selection box. <b>ARMY</b> selects every fighter. <b>HUB</b> jumps to your base.</li><li><b>1 · 2 · 3</b> are squads: hold one to save the selection, tap it to recall, double-tap it to jump there.</li><li>Tap a building to use it. With nothing selected, the bottom panel is the build menu.</li></ul>'],
 ['Economy','<ul><li>Harvesters mine crystal and bring it to the Hub or a Refinery. Fields run out, so expand to new ones.</li><li>Dustrunners are fast harvesters that can also capture buildings. Hackers earn crystal while they stand still.</li><li>Points of interest such as Crystal Wells, Supply Caches and Vaults pay their owner.</li><li>You can build within reach of your buildings, near points you hold, and around a Mobile Command.</li></ul>'],
 ['Buildings','<ul><li><b>Base</b>: Barracks (infantry), Foundry (vehicles), Refinery, Armory (infantry research), Lab (advanced tech), Airfield (aircraft), Service Bay (repairs) and Mast (long sight).</li><li><b>Defense</b>: Turret, Flak (anti-air), Redoubt (anti-infantry), Bulwark (anti-armor), Longbow (artillery) and Beacon (Storm Strike).</li><li><b>Naval</b> (sea maps only): Dock, Shipyard, Naval Base and Shore Battery.</li><li><b>Super</b>: five super weapons, one of each, after a Lab.</li><li>Any building except the Hub can be sold for half its price.</li></ul>'],
 ['Units','<ul><li><b>Infantry</b> are cheap and flexible. Troopers fight infantry; Lancers fight armor and aircraft; Grenadiers blast groups; Medics heal; Engineers capture; Sappers wreck buildings; Marksmen snipe; the Vanguard is a hero.</li><li><b>Vehicles</b>: the Skiff raids, the Bastion and Paladin are tanks, the Scorcher burns, the Warden shoots aircraft, the Crawler and Volley are artillery, the Mender repairs, the Aegis shields and the Jolt stuns. The Ironclad is the heaviest of all.</li><li><b>Aircraft</b>: gunships and drones hover; planes fly sorties from an Airfield; the Albatross carries troops; the Seraph repairs; the Citadel and Aerie are flying fortresses.</li><li><b>Ships</b>: patrol boats, torpedo boats, frigates, three kinds of battleship and the Rookery carrier.</li><li>Units rank up from kills. The Directory has every number.</li></ul>'],
 ['Commanders','<p>You pick a commander before a battle. Each has strengths and weaknesses, and most have a signature ability:</p><ul>'+CMD.map(c=>'<li><b>'+c.n+'</b> · '+c.t+(c.ab?' — '+c.ab.f:'')+'</li>').join('')+'</ul>'],
 ['Command Stars','<ul><li>Kills earn XP; each new rank gives a <b>★</b> to spend in the star tree (tap ★).</li><li>Four branches: <b>Strike</b> (aimed abilities such as Recon, Mortar Barrage, Airdrop and Hammerfall), <b>Doctrine</b> (passives and special units), <b>Economy</b> and <b>Fleet</b>.</li><li>Every skill has three levels, and deeper rows open as you spend in that branch.</li></ul>'],
 ['Points of interest and terrain','<ul><li>Hold the circle around a point with ground troops to capture it. Some pay crystal, some land reinforcements, give sight or repair, and some are big guns.</li><li><b>GUARDED</b> points shoot back until taken.</li><li>Rivers stop ground units except at bridges, and mountains stop everything on the ground. Aircraft fly over both.</li><li>Derelicts (abandoned vehicles and buildings) can be claimed by infantry once you research Salvage Teams.</li></ul>'],
 ['Air and sea','<ul><li>Only infantry rockets, Skiffs, Wardens, Paladins, Flak and some ships can hit aircraft.</li><li>Planes need a hangar slot at an Airfield (four each), fly sorties and come home to reload. Return calls them back.</li><li>Ships only exist on maps with a sea. Docks, Shipyards and Naval Bases must touch the water. The Shearwater lands troops on a shore.</li></ul>'],
 ['Super weapons','<ul><li>The Faultline Engine, Vortex Spire, Meridian Cannon, Lodestar Array and Boreal Array. Each needs a Lab, and you can have one of each.</li><li>Each charges for several minutes, then gets a button on the right: tap it, then tap a scouted spot.</li><li>Every player is warned when one is built and again when it fires.</li></ul>'],

 {const m=G.money[0],st=C.st;if(m>st.pm)st.earned+=m-st.pm;else st.spent+=st.pm-m;st.pm=m;}

 const i=C.i,nxt=win&&i+1<CAMP.length&&!CAMP[i+1].tut;let h='<div class="box cend"><p class="ckick">'+(win?'Mission complete':'Mission failed')+'</p><h1>'+(win?cesc(def.n)+' <i>secured</i>':cesc(def.n)+' <i>lost</i>')+'</h1><p class="csub">Mission '+(i+1)+' · '+CDN[C.d]+' · '+cfmt(C.t)+'</p>';
